<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Martin & Ngibo - Wedding RSVP</title>
  
  <!-- Google Fonts for Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --maroon: #60181b;
      --burgundy: #4a1013;
      --terracotta: #c46d4e;
      --soft-bg: #f8f4f0;
      --card-white: #ffffff;
      --text-dark: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--soft-bg);
      /* Subtle floral aesthetic overlay */
      background-image: 
        radial-gradient(circle at top left, rgba(196, 109, 78, 0.15), transparent 40%),
        radial-gradient(circle at bottom right, rgba(96, 24, 27, 0.15), transparent 40%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
    }

    /* Container */
    .wedding-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Arched Invitation Card Style */
    .arch-card {
      background: var(--card-white);
      border-radius: 200px 200px 24px 24px;
      padding: 60px 30px 40px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Subtitles & Typography */
    .header-tagline {
      font-family: 'Cinzel', serif;
      color: var(--maroon);
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .couple-names {
      font-family: 'Alex Brush', cursive;
      font-size: 4.5rem;
      color: var(--maroon);
      line-height: 1.1;
      margin: 10px 0;
      font-weight: normal;
    }

    .ampersand {
      font-family: 'Alex Brush', cursive;
      font-size: 3.5rem;
      display: block;
      margin: -10px 0;
      color: var(--maroon);
    }

    .invitation-text {
      font-family: 'Cinzel', serif;
      color: var(--maroon);
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 25px 0;
      line-height: 1.6;
    }

    /* Details Grid (Date & Venue) */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 30px 0;
      padding: 15px 0;
      border-top: 1px solid rgba(96, 24, 27, 0.15);
      border-bottom: 1px solid rgba(96, 24, 27, 0.15);
      align-items: center;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .detail-item:first-child {
      border-right: 1px solid rgba(96, 24, 27, 0.2);
      padding-right: 10px;
    }

    .detail-icon {
      width: 24px;
      height: 24px;
      fill: var(--maroon);
    }

    .detail-text {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.3;
    }

    /* Form Styling */
    .rsvp-section-title {
      font-family: 'Cinzel', serif;
      color: var(--maroon);
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--maroon);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0d0c8;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      background-color: #faf8f6;
      color: var(--text-dark);
      outline: none;
      transition: border 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--maroon);
      background-color: #ffffff;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--maroon);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--burgundy);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Confirmation Box */
    .confirmation-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #f0f7f4;
      border: 1px solid #c3e6cb;
      border-radius: 8px;
      color: #155724;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="wedding-container">
    <!-- Main Arch Card -->
    <div class="arch-card">
      
      <!-- Top Tagline -->
      <div class="header-tagline">
        Together<br>With Their Families
      </div>

      <!-- Names -->
      <div class="couple-names">Martin</div>
      <div class="ampersand">&</div>
      <div class="couple-names">Ngibo</div>

      <!-- Subtitle -->
      <div class="invitation-text">
        Invite you to their<br>
        <strong>Wedding Celebration</strong>
      </div>

      <!-- Date & Location Section -->
      <div class="details-grid">
        <div class="detail-item">
          <!-- Calendar Icon -->
          <svg class="detail-icon" viewBox="0 0 24 24">
            <path d="M19,4H18V2H16V4H8V2H6V4H5C3.89,4 3,4.89 3,6V20A2,2 0 0,0 5,22H19A2,2 0 0,0 21,20V6A2,2 0 0,0 19,4M19,20H5V10H19V20M19,8H5V6H19V8M9,14H7V12H9V14M13,14H11V12H13V14M17,14H15V12H17V14M9,18H7V16H9V18M13,18H11V16H13V18M17,18H15V16H17V18Z"/>
          </svg>
          <div class="detail-text">
            23rd September, 2026<br>
            08:00 hrs
          </div>
        </div>

        <div class="detail-item">
          <!-- Location Icon -->
          <svg class="detail-icon" viewBox="0 0 24 24">
            <path d="M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5Z"/>
          </svg>
          <div class="detail-text">
            Lusaka Civic<br>
            Centre
          </div>
        </div>
      </div>

      <!-- RSVP Form -->
      <div class="rsvp-section-title">RSVP Online</div>

      <form id="rsvpForm">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
          <label for="attendance">Will you attend?</label>
          <select id="attendance" name="attendance" required>
            <option value="" disabled selected>Select an option</option>
            <option value="Joyfully Accepts">Joyfully Accepts</option>
            <option value="Regretfully Declines">Regretfully Declines</option>
          </select>
        </div>

        <div class="form-group">
          <label for="guests">Number of Guests</label>
          <select id="guests" name="guests">
            <option value="1">1 Person</option>
            <option value="2">2 Persons</option>
          </select>
        </div>

        <div class="form-group">
          <label for="note">Message / Dietary Requirements</label>
          <textarea id="note" name="note" rows="3" placeholder="Any dietary restrictions or warm wishes..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit RSVP</button>
      </form>

      <!-- Submission Confirmation Message -->
      <div id="confirmation" class="confirmation-message">
        Thank you! Your RSVP response has been submitted successfully.
      </div>

    </div>
  </div>

  <script>
    // Form submission handling logic
    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const fullName = document.getElementById('fullname').value;
      const attendance = document.getElementById('attendance').value;
      const guests = document.getElementById('guests').value;
      const note = document.getElementById('note').value;

      // Log data to console (replace/connect this block to your backend or Google Form link)
      console.log('RSVP Received:', { fullName, attendance, guests, note });

      // Hide form and display confirmation message
      document.getElementById('rsvpForm').style.display = 'none';
      const confirmationBox = document.getElementById('confirmation');
      confirmationBox.style.display = 'block';
      confirmationBox.innerHTML = `<strong>Thank you, ${fullName}!</strong><br>Your response (${attendance}) has been recorded.`;
    });
  </script>

</body>
</html>
